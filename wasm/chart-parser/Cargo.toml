[package]
name = "chart-review-parser"
version = "0.1.0"
edition = "2024"
description = "Browser-side chart parser for chart-review"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chart = { git = "https://github.com/xlair-dev/ChartConverter.git", rev = "aefd69a0ddc0f849b6b6f70de408b5405317d307" }
chart-converter = { git = "https://github.com/xlair-dev/ChartConverter.git", rev = "d18ab3314fb7d6a7c53a70857e0a9ddc18cbeb03" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.105"
