[package]
name = "chart-review-parser"
version = "0.1.0"
edition = "2024"
description = "Browser-side chart parser for chart-review"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chart = { git = "https://github.com/xlair-dev/ChartConverter.git", rev = "1e99cf2211701324f01fd2f6d29d1e0472d40b6f" }
chart-converter = { git = "https://github.com/xlair-dev/ChartConverter.git", rev = "47c70d9ef33a4f82d90ee4c4ad8454a1bf3c9ff0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.105"
