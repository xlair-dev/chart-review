[package]
name = "chart-review-parser"
version = "0.1.0"
edition = "2024"
description = "Browser-side chart parser for chart-review"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chart = { git = "https://github.com/xlair-dev/ChartConverter.git", rev = "17bc198d44475481dcde6ff69bfd6668c68b0803" }
chart-converter = { git = "https://github.com/xlair-dev/ChartConverter.git", rev = "17bc198d44475481dcde6ff69bfd6668c68b0803" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.105"
