[package]
name = "chart-review-parser"
version = "0.1.0"
edition = "2024"
description = "Browser-side chart parser for chart-review"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chart = { git = "https://github.com/xlair-dev/ChartConverter.git", rev = "9d0bd8843f915adaf2ca61f425b9cf5e1f5c8a49" }
chart-converter = { git = "https://github.com/xlair-dev/ChartConverter.git", rev = "9d0bd8843f915adaf2ca61f425b9cf5e1f5c8a49" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.105"
