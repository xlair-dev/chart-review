[package]
name = "chart-review-parser"
version = "0.1.0"
edition = "2024"
description = "Browser-side chart parser for chart-review"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chart = { git = "https://github.com/xlair-dev/ChartConverter.git", rev = "ff05a59bec4f23b2d40ed5a8f443a2e9ddd59e3c" }
chart-converter = { git = "https://github.com/xlair-dev/ChartConverter.git", rev = "ff05a59bec4f23b2d40ed5a8f443a2e9ddd59e3c" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.105"
