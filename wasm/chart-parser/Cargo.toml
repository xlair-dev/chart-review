[package]
name = "chart-review-parser"
version = "0.1.0"
edition = "2024"
description = "Browser-side chart parser for chart-review"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chart = { git = "https://github.com/xlair-dev/ChartConverter.git", rev = "2f2beeee0a1c722f92141d88f74de3bdc5b61a9d" }
chart-converter = { git = "https://github.com/xlair-dev/ChartConverter.git", rev = "2f2beeee0a1c722f92141d88f74de3bdc5b61a9d" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.105"
